name: windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # 06:00 Moscow time

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}

jobs:
  build:
    # Windows 11 based: it opens upstream's util/aux.h as a plain file
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - name: Check out upstream
        id: upstream
        shell: bash
        run: |
          # upstream's own submodules (imgui, implot, ...) have SSH URLs; the runner has no key
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          # upstream has src/ucanopen_servers/atvvcu/util/aux.h; Git for Windows
          # refuses AUX, a DOS device name, unless this check is off
          git config --global core.protectNTFS false
          # keep upstream sources byte for byte as in the repository, so the patches apply
          git config --global core.autocrlf false
          git submodule update --init upstream
          old=$(git -C upstream rev-parse HEAD)

          # nightly and manual runs follow upstream develop; pushes build the recorded commit
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            git submodule update --remote upstream
          fi
          git -C upstream submodule update --init --recursive

          new=$(git -C upstream rev-parse HEAD)
          echo "sha=${new:0:7}" >> "$GITHUB_OUTPUT"
          echo "old=$old" >> "$GITHUB_OUTPUT"
          if [ "$old" = "$new" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git -C upstream log --oneline "$old..$new"
          fi

          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$old" = "$new" ]; then
            echo "Upstream has not changed, nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply Windows patches
        if: steps.upstream.outputs.build == 'true'
        shell: bash
        run: sh win/patches/apply.sh

      - uses: msys2/setup-msys2@v2
        if: steps.upstream.outputs.build == 'true'
        with:
          msystem: UCRT64
          update: true
          install: git
          pacboy: >-
            gcc:p
            libatomic:p
            cmake:p
            ninja:p
            glfw:p
            boost:p

      - name: Build
        if: steps.upstream.outputs.build == 'true'
        shell: msys2 {0}
        run: |
          git config --global --add safe.directory '*'
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -- -k 0
          cmake --install build --prefix dist/ucan-monitor
          ls dist/ucan-monitor/bin

      - uses: actions/upload-artifact@v7
        if: steps.upstream.outputs.build == 'true'
        with:
          name: ucan-monitor-win-${{ steps.upstream.outputs.sha }}
          path: dist/
          if-no-files-found: error

      - name: Record the upstream commit
        if: steps.upstream.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream
          git commit -q -F - <<EOF
          update upstream to ${{ steps.upstream.outputs.sha }}

          $(git -C upstream log --oneline "${{ steps.upstream.outputs.old }}..HEAD")
          EOF
          git push
