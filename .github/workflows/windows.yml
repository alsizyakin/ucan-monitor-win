name: windows

on:
  push:
    branches: [main]
    # documentation alone changes nothing in the program
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Windows image to build on
        type: choice
        options: [windows-latest, windows-2022, windows-2025]
        default: windows-latest
  schedule:
    - cron: '0 3 * * *' # 06:00 Moscow time

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}

jobs:
  build:
    timeout-minutes: 30
    runs-on: ${{ inputs.runner || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release notes list the commits since the last release

      - name: Check out upstream
        id: upstream
        shell: bash
        run: |
          # upstream's own submodules (imgui, implot, ...) have SSH URLs; the runner has no key
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          # keep upstream sources byte for byte as in the repository, so the patches apply
          git config --global core.autocrlf false

          # Keep the CANopen-v1 device set recorded in this repository.
          # Upstream develop now uses an incompatible protocol/device set.
          sh win/checkout-upstream.sh
          sha=$(git -C upstream rev-parse HEAD)
          echo "sha=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Prepare upstream for Windows
        shell: bash
        run: sh win/patches/apply.sh

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git
          pacboy: >-
            gcc:p
            libatomic:p
            cmake:p
            ninja:p
            glfw:p
            boost:p
            pkgconf:p
            libusb:p

      - name: Build
        shell: msys2 {0}
        run: |
          git config --global --add safe.directory '*'
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -- -k 0
          ctest --test-dir build --output-on-failure
          cmake --install build --prefix dist/ucan-monitor
          ls dist/ucan-monitor/bin

      - uses: actions/upload-artifact@v7
        with:
          name: ucan-monitor-win-${{ steps.upstream.outputs.sha }}
          path: dist/
          if-no-files-found: error

      - name: Publish the release
        # Nightly checks produce artifacts; releases use the recorded source.
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target=$(git rev-parse HEAD)
          upstream=$(git -C upstream rev-parse HEAD)
          previous=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)

          # always the same name, so .../releases/latest/download/ucan-monitor-win.zip stays valid
          (cd dist && 7z a -tzip -bso0 -bsp0 ../ucan-monitor-win.zip ucan-monitor)

          {
            echo "Код разработчика: CANopen v1 $(git -C upstream log -1 --date=format:%d.%m.%Y --format='%h от %cd: %s')."
            if [ -n "$previous" ]; then
              previous_upstream=$(git ls-tree "$previous" upstream | awk '{ print $3 }')
              echo
              echo "**Изменения разработчика с $previous:**"
              git -C upstream log --format='- %s' "$previous_upstream..$upstream" | grep . || echo "- нет"
              echo
              echo "**Изменения сборки для Windows с $previous:**"
              git log --format='- %s' "$previous..$target" -- . ':!upstream' ':!*.md' ':!docs' | grep . || echo "- нет"
            fi
            echo
            echo "Распаковать \`ucan-monitor-win.zip\` и запустить \`ucan-monitor\\bin\\ucan-monitor.exe\`." \
                 "Подробнее — в [README](https://github.com/$GITHUB_REPOSITORY#readme)."
          } > notes.md
          cat notes.md

          gh release create "win-$GITHUB_RUN_NUMBER" ucan-monitor-win.zip \
            --target "$target" \
            --title "uCAN Monitor for Windows: CANopen v1 ${upstream:0:7}, $(date +%Y-%m-%d)" \
            --notes-file notes.md \
            --latest
